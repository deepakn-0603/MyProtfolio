apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: my-portfolio-role-binding
  namespace: default

subjects:
  - kind: ServiceAccount
    name: my-portfolio-service-account
    namespace: default
roleRef:
  kind: Role
  name: my-portfolio-role
  apiGroup: rbac.authorization.k8s.io