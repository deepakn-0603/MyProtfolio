services:
  web:
    build: .
    container_name: my-portfolio
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: always
    command: npm start

  Jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

volumes:
  jenkins_home: